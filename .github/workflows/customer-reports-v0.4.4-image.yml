name: Publish customer reports raw-download image

on:
  push:
    tags: ["customer-reports-v0.4.4"]

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/loopjet-llc/loopjet-frappe-suite:platform-v0.4.4-customer-reports

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: loopjet-llc/loopjet-frappe-custom
          ref: ea7aecf9bc381458e6539896fe5c5ecd28144b96
          path: .customer-reports-custom
          persist-credentials: false
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build from the current customer-reports production digest
        run: |
          docker build -f docker/CustomerReportsV044.Containerfile \
            --label org.opencontainers.image.revision="${GITHUB_SHA}" \
            --label org.opencontainers.image.version=platform-v0.4.4-customer-reports \
            --tag "$IMAGE" .
      - name: Verify raw customer-report download implementation
        run: docker run --rm -i --network none --entrypoint /home/frappe/frappe-bench/env/bin/python "$IMAGE" - < scripts/check-customer-reports-v0.4.4-image.py
      - name: Publish the verified image
        run: docker push "$IMAGE"
